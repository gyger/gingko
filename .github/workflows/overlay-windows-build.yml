# Windows installer for the desktop app, built from the overlay branch.
# Each run replaces the single rolling release `overlay-build`, so the
# download URL stays the same:
#   https://github.com/<owner>/<repo>/releases/download/overlay-build/Gingko-Writer-Setup.exe
name: Overlay Windows Build

on:
  push:
    branches: [ overlay ]
  workflow_dispatch:

concurrency:
  group: overlay-windows-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - uses: actions/cache@v4
        with:
          path: client/elm-home
          key: elm-${{ hashFiles('client/elm.json') }}

      # The npm `elm` package needs its install script, and install scripts
      # stay off (see below), so fetch the compiler directly.
      - name: Install Elm 0.19.1
        run: |
          curl -sSL -o "$RUNNER_TEMP/elm.gz" https://github.com/elm/compiler/releases/download/0.19.1/binary-for-windows-64-bit.gz
          gunzip -c "$RUNNER_TEMP/elm.gz" > "$RUNNER_TEMP/elm.exe"
          echo "ELM_BINARY=$RUNNER_TEMP\\elm.exe" >> "$GITHUB_ENV"

      # --ignore-scripts skips the Electron download and native modules
      # (node-pty) that only the web/Electron tooling needs.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build installer
        run: |
          cp config-example.js config.js
          bunx tauri build --bundles nsis
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "$RUNNER_TEMP/Gingko-Writer-Setup.exe"

      - name: Publish to the overlay-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete overlay-build --yes --cleanup-tag || true
          gh release create overlay-build "$RUNNER_TEMP/Gingko-Writer-Setup.exe" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Gingko Writer for Windows (overlay build)" \
            --notes "Built from overlay at $GITHUB_SHA."
