[package]
name = "gingko-writer-desktop"
version = "3.0.0"
description = "Gingko Writer Desktop (Tauri)"
authors = ["Gingko Inc"]
license = "MIT"
repository = "https://github.com/gingko/client"
edition = "2021"

[lib]
name = "gingko_writer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
hex = "0.4"
rfd = "0.15"
sevenz-rust2 = "0.20.2"
rusty-leveldb = "4.0.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
